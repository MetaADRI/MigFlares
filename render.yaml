# Render Blueprint — Mig Flares API
# Deploy: connect your GitHub repo, Render reads this file automatically.
# Fill the `sync: false` env vars in the Render dashboard after the first deploy.
services:
  - type: web
    name: mig-flares-api
    runtime: node
    repo: https://github.com/MetaADRI/MigFlares
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: car-wash

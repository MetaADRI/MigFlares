name: Keep Render API warm

# Render free instances spin down after ~15 minutes of inactivity and can
# take up to a minute to cold-start — the first request after idle often
# fails with a 500 or timeout, which the app surfaced as a false
# "invalid credentials" on login. Pinging the health endpoint every 10
# minutes keeps the instance awake so logins stay fast and reliable.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://migflares.onrender.com/api/health)
          echo "Health check returned HTTP $code"
          if [ "$code" -ge 500 ]; then
            echo "API unhealthy" >&2
            exit 1
          fi
